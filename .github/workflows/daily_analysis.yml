name: Daily Instagram Analysis

on:
  schedule:
    - cron: '0 22 * * *'  # UTC 22:00 = JST 07:00
  workflow_dispatch:        # 手動実行ボタンも有効化

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # .env を作成しない — シークレットを直接OS環境変数として渡す。
      # load_dotenv() は既存の環境変数を上書きしないので、
      # GitHub Actions の env: ブロックがそのまま有効になる。
      - name: Run daily analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          INSTAGRAM_FETCH_PROVIDER: ${{ secrets.INSTAGRAM_FETCH_PROVIDER }}
        run: bash run_daily.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 30
